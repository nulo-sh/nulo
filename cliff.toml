# git-cliff config — release notes for @nulo/extension.
# Scoped via `--include-path` in the workflow; filters out other packages.
# A version containing "-" (rc, nightly) is a prerelease, as in release.yml's resolve step. The
# stores carry only stable releases, so only a stable release's notes link to them.

[changelog]
header = ""
trim = true
body = """
{% if version -%}
{% set v = version | trim_start_matches(pat="v") -%}
## {{ v }}

{% if v is containing("-") -%}
### Install (prerelease)

This build is a prerelease and is not on the stores. The stores carry the latest stable release.

1. Download `nulo-chrome-{{ v }}.zip` from the assets below.
2. Unzip it.
3. Open `chrome://extensions` and turn on Developer mode.
4. Click Load unpacked and select the unzipped folder.

Verify: `shasum -a 256 -c SHASUMS256.txt`

The Firefox zip is unsigned. Load it from `about:debugging` as a temporary add-on.

{% else -%}
### Install

- Chrome: [Chrome Web Store](https://chromewebstore.google.com/detail/jlmiaokmjoicmclelpiiocdhncddkdmc)
- Firefox: [Firefox Add-ons](https://addons.mozilla.org/firefox/addon/3077967/)

The stores review each version, so they can trail this release by a few days.

### Verify or load by hand

The zips below are the same builds. Verify them with `shasum -a 256 -c SHASUMS256.txt`. To load the Chrome zip by hand, unzip it, open `chrome://extensions`, turn on Developer mode and click Load unpacked. The Firefox zip is unsigned; the signed build comes from Firefox Add-ons.

{% endif -%}
---
{% else -%}
## Unreleased
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\\n") | first | upper_first }}\
  {% if commit.scope %} ({{ commit.scope }}){% endif %}\
  {% if commit.id %} [`{{ commit.id | truncate(length=7, end="") }}`]({% if remote.github.repo %}https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}{% endif %}){% endif %}
{% endfor %}
{% endfor %}
"""
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = "^v0\\..*-internal"
sort_commits = "newest"

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^build|^ci", group = "Build / CI" },
  { message = "^chore", group = "Chore" },
  { message = "^revert", group = "Reverts" },
  { message = "^style", group = "Style" },
  { message = ".*", group = "Other" },
]
