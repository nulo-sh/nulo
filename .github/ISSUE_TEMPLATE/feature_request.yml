name: Feature request
description: Suggest something Nulo should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task or problem in your own words, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. A rough idea is fine.
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Workarounds, other wallets that do this well, links.
