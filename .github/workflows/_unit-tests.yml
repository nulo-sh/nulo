name: _Unit tests (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout.
        required: false
        type: string
        default: ""

jobs:
  unit-tests:
    name: Vitest (shard ${{ matrix.shard }})
    # Keep this job unconditional: a caller reads it as one result, and a skipped job reads as success.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Every leg reports, so one red leg never hides another's result.
      fail-fast: false
      matrix:
        # Each leg runs a third of the extension's suite (vitest's own --shard, by path hash) and one
        # other piece, so `test:all`, `test:release` and `test:ci-gating` each still run once.
        # scripts/ci-cd/behavior-gating.test.ts pins which leg runs what.
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ./.github/actions/setup-bun

      - name: Run the extension's unit tests, shard ${{ matrix.shard }}
        run: bun run --cwd apps/extension test -- --shard=${{ matrix.shard }}

      - name: Run unit tests in every other package
        if: matrix.shard == '1/3'
        run: bun run --filter '@nulo/*' --filter '!@nulo/extension' --if-present test

      # The staged-package tests import every published export under Node 24 ESM as well as Bun, and
      # the CI-gating tests spawn Node; workspace suites that use Node keep the runner's.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run release-script unit tests
        if: matrix.shard == '2/3'
        # Not @nulo/* workspaces, so outside `test:all`; the guard keeps older refs green.
        run: |
          if [ -d scripts/release ]; then
            bun run test:release
          else
            echo "scripts/release/ not present on this ref — skipping."
          fi

      # The ratchet's move approval: read live here, so a re-run of this job sees the label as it is
      # then. Guarded as the steps around it are: a head without the script predates the ratchet
      # that reads its answer.
      - name: Read the live move-approval label
        id: live
        if: matrix.shard == '3/3' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -f scripts/ci-cd/live-labels.sh ]; then
            bash scripts/ci-cd/live-labels.sh baseline:move-approved
          else
            echo "scripts/ci-cd/live-labels.sh not present on this ref — skipping."
          fi

      - name: Run CI-gating guard test
        if: matrix.shard == '3/3'
        env:
          BASELINE_MOVE_APPROVED: ${{ steps.live.outputs.label-hit }}
        # The paths-filter gates' anti-drift guard: it MUST run on PRs, or an ungated @nulo/* dependency
        # merges green. Not a @nulo/* workspace; the guard keeps older refs green.
        run: |
          if [ -d scripts/ci-cd ]; then
            bun run test:ci-gating
          else
            echo "scripts/ci-cd/ not present on this ref — skipping."
          fi
