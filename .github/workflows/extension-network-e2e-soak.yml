name: Extension network e2e soak

# Manual repeat-runner: the named network test files, `repeats` times SEQUENTIALLY (max-parallel: 1)
# on fresh runners, on Chrome, with `retry: "0"` by default so a test that passes only on a retry
# FAILS its iteration ("zero test retries"). `fail-fast: false` runs every iteration so the pass rate
# is visible even when one fails. Each iteration's vitest report is read back, so a test that skipped
# (an unarmed opt-in, a browser-gated block) reds it too.
#
# The whole suite never fits one 30-minute job: a whole-suite run at retry 0 on a branch is a
# dispatch of `Extension network e2e` and `Extension network e2e (Firefox)`, which run the lane.
# `nightly.yml` builds dev only, at the config-default retries.

on:
  workflow_dispatch:
    inputs:
      test_files:
        description: "network test files, space- or newline-separated: tests/e2e/network/<name>.test.ts or tests/e2e/egress-guard.test.ts; they must fit one 30-minute job, and every test in them must run (send-chaos and the opt-in files skip, so they red). The whole suite is a dispatch of the PR network workflows."
        type: string
        required: true
      repeats:
        description: "iterations to run (1-25)"
        type: string
        default: "5"
      proverless:
        description: "proverless build (fast; Presto OFF)"
        type: boolean
        default: true
      disable_presto:
        description: "skip presto-server (no-op under proverless)"
        type: boolean
        default: false
      retry:
        description: 'vitest retry, empty or one digit; "0" = the zero-retry acceptance gate, empty = the config default'
        type: string
        default: "0"

concurrency:
  group: extension-network-e2e-soak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  prep:
    name: Build iteration matrix
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      iterations: ${{ steps.gen.outputs.iterations }}
    steps:
      # The file list is checked against the tree before any runner is spent on it: vitest takes each
      # name as a case-insensitive substring filter and ORs them, so a typo beside a real path is dropped.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: apps/extension/tests/e2e
      - id: gen
        env:
          TEST_FILES: ${{ inputs.test_files }}
          REPEATS: ${{ inputs.repeats }}
          RETRY: ${{ inputs.retry }}
        run: |
          set -euo pipefail
          # The suite's own split, so prep judges exactly the arguments the agent receives.
          read -ra TEST_FILE_LIST <<< "${TEST_FILES//$'\n'/ }"
          if [ "${#TEST_FILE_LIST[@]}" -eq 0 ]; then
            echo "::error::test_files names no file. A soak repeats named files; the whole suite is a dispatch of 'Extension network e2e' and 'Extension network e2e (Firefox)' (nightly.yml builds dev only)."
            exit 1
          fi
          for f in "${TEST_FILE_LIST[@]}"; do
            if ! [[ "$f" =~ ^tests/e2e/(network/[A-Za-z0-9_-]+|egress-guard)\.test\.ts$ ]]; then
              echo "::error::test_files must name tests/e2e/network/<name>.test.ts or tests/e2e/egress-guard.test.ts, got '$f'"
              exit 1
            fi
            if [ ! -f "apps/extension/$f" ]; then
              echo "::error::test_files names no file at this commit: '$f'"
              exit 1
            fi
          done
          if ! [[ "$REPEATS" =~ ^([1-9]|1[0-9]|2[0-5])$ ]]; then
            echo "::error::repeats must be 1 to 25, got '$REPEATS'"
            exit 1
          fi
          if ! [[ "$RETRY" =~ ^[0-9]?$ ]]; then
            echo "::error::retry must be empty or one digit, got '$RETRY'"
            exit 1
          fi
          iterations=$(seq 1 "$REPEATS" | jq -cRn '[inputs]')
          echo "iterations=$iterations" >> "$GITHUB_OUTPUT"
          echo "Soak will run $REPEATS iteration(s) of ${#TEST_FILE_LIST[@]} file(s): $iterations"

  soak:
    name: iter ${{ matrix.iteration }}
    needs: prep
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        iteration: ${{ fromJSON(needs.prep.outputs.iterations) }}
    uses: ./.github/workflows/_extension-network-e2e.yml
    with:
      ref: ${{ github.ref }}
      # The `soak` prefix arms the suite's read-back of every named test.
      shard_label: soak-${{ matrix.iteration }}
      test_files: ${{ inputs.test_files }}
      proverless: ${{ inputs.proverless }}
      disable_presto: ${{ inputs.disable_presto }}
      retry: ${{ inputs.retry }}

  status:
    name: Status
    if: always()
    needs: [prep, soak]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate
        env:
          PREP: ${{ needs.prep.result }}
          SOAK: ${{ needs.soak.result }}
          REPEATS: ${{ inputs.repeats }}
          RETRY: ${{ inputs.retry }}
        run: |
          set -euo pipefail
          if [ "$PREP" != "success" ]; then
            echo "::error::The iteration matrix was not built (prep=$PREP): a refused input is named in its log."
            exit 1
          fi
          if [ "$SOAK" != "success" ]; then
            echo "::error::Soak NOT clean (soak=$SOAK): a red iteration at retry=${RETRY:-default} is a flake to fix or breakage."
            exit 1
          fi
          # The suite's one infra-boot retry (exit 86) reruns no test, so it is no test retry.
          if [ "$RETRY" = "0" ]; then
            echo "Soak clean: all $REPEATS iteration(s) green, every named test ran, with zero test retries."
          else
            echo "Soak clean: all $REPEATS iteration(s) green, every named test ran, at retry=${RETRY:-default}: a test may have passed on a retry."
          fi
