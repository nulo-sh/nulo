name: Quality

on:
  workflow_dispatch:
  pull_request:
    # NO `branches:` filter, deliberately. That key filters on the PR's BASE, so
    # `[main, dev]` silently gave ZERO CI to every stacked PR — a stack's middle
    # arcs target their parent feature branch, never dev, so no workflow fired and
    # the PRs sat with no checks at all rather than with red ones. Gating every PR
    # regardless of base costs CI minutes and makes each arc independently
    # verifiable; a bad middle arc is otherwise invisible until it reaches dev.
    # `ready_for_review` gives a draft marked ready a fresh run on its head. Nothing
    # here reads the draft flag, so the head normally has a result already; the
    # fresh run can replace one that failed, was cancelled or never started.
    #
    # NO `labeled`/`unlabeled`: nothing in this workflow reads labels, so for a
    # SHA this workflow has already covered a label event would only queue a
    # second identical run. It could incidentally recover a head with no run of
    # its own, which is why the gap below matters. The label-gated suites keep
    # both types: their gates read labels.
    #
    # Gap: a PR RETARGETED to dev/main fires `edited`, not listed here, so a head
    # that never got a run can sit at required `quality-status: Expected`
    # forever. `edited` is not the fix — it also fires on every title/body edit,
    # so each unrelated edit would queue a full re-run. Recover by closing and
    # reopening the PR or by pushing a commit: the checks of a
    # `workflow_dispatch` run never count toward a pull request's required checks.
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  # One queue per head commit, so a late run of an older push can neither cancel nor replace the
  # current head's run; pr-supersede.yml cancels the runs of heads the pull request moved past.
  group: pr-quick-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core-foundation: ${{ steps.override.outputs.full || steps.filter.outputs.core-foundation }}
      aztec-runtime: ${{ steps.override.outputs.full || steps.filter.outputs.aztec-runtime }}
      wallet-bridge: ${{ steps.override.outputs.full || steps.filter.outputs.wallet-bridge }}
      extension: ${{ steps.override.outputs.full || steps.filter.outputs.extension }}
      playground: ${{ steps.override.outputs.full || steps.filter.outputs.playground }}
      landing: ${{ steps.override.outputs.full || steps.filter.outputs.landing }}
      workflows: ${{ steps.override.outputs.full || steps.filter.outputs.workflows }}
      root-config: ${{ steps.override.outputs.full || steps.filter.outputs.root-config }}
      needs-extension-build: ${{ steps.compute.outputs.needs-extension-build }}
      needs-landing-build: ${{ steps.compute.outputs.needs-landing-build }}
      audit-mode: ${{ steps.audit-mode.outputs.audit-mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: paths-filter needs the merge-base with the comparison
          # branch. On a shallow clone it falls back to a `fetch --deepen` loop,
          # which hits git's "shallow file has changed since we read it" race
          # whenever the merge-base sits beyond the initial depth (structural on
          # long-running branches ~100+ commits from the base).
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          filters: |
            # Graph-derived (see CI.md "CI gating"): dependency libraries by consumed
            # src + manifest; built targets by whole package. NO `!` negations (the dorny
            # `some`-quantifier footgun). Pinned by scripts/ci-cd/behavior-gating.test.ts.
            core-foundation:
              - 'packages/wallet-core/src/**'
              - 'packages/wallet-core/package.json'
              - 'packages/wallet-crypto/src/**'
              - 'packages/wallet-crypto/package.json'
              - 'packages/extension-messaging/src/**'
              - 'packages/extension-messaging/package.json'
              - 'packages/wallet-sdk-schema-patch/src/**'
              - 'packages/wallet-sdk-schema-patch/package.json'
            aztec-runtime:
              - 'packages/aztec-runtime/src/**'
              - 'packages/aztec-runtime/package.json'
            wallet-bridge:
              - 'packages/wallet-bridge/src/**'
              - 'packages/wallet-bridge/package.json'
            extension:
              # Built target — whole package; its dep libs outside the filters above — src + manifest.
              - 'apps/extension/**'
              - 'packages/legal/src/**'
              - 'packages/legal/package.json'
              - 'packages/design/src/**'
              - 'packages/design/package.json'
              - 'packages/resolve-asset/src/**'
              - 'packages/resolve-asset/package.json'
              # The licence texts and the expected-minimum list are build inputs too.
              - 'packages/third-party-notices/src/**'
              - 'packages/third-party-notices/package.json'
              - 'packages/third-party-notices/texts/**'
              - 'packages/third-party-notices/bin/**'
              - 'packages/third-party-notices/expected-minimum.txt'
            playground:
              - 'apps/playground/**'
            landing:
              # Built target — landing (whole package) + the legal documents it renders and
              # the dep libs it builds from.
              - 'apps/landing/**'
              - 'legal/**'
              - 'packages/legal/src/**'
              - 'packages/legal/package.json'
              - 'packages/design/src/**'
              - 'packages/design/package.json'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
            root-config:
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'biome.json'
              - 'tsconfig.json'
              - '.commitlintrc.json'
              - '.githooks/**'
              - 'patches/**'
            # What decides the audit gate's mode; scripts/ci-cd/audit-gate.ts reads the same set.
            deps:
              - 'bun.lock'
              - 'bunfig.toml'
              - 'scripts/ci-cd/audit-acks.json'
              - '**/package.json'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "full=true" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-bun
        if: github.event_name == 'pull_request' && steps.filter.outputs.deps == 'true'
        with:
          cache: "false"
          install: "false"
      # A pull request that changes dependencies beyond version lines must leave no advisory
      # unacknowledged; a Release PR, the main → dev sync and every other run only report.
      - name: Choose the audit mode
        id: audit-mode
        env:
          EVENT: ${{ github.event_name }}
          DEPS: ${{ steps.filter.outputs.deps }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$DEPS" = true ]; then
            bun scripts/ci-cd/audit-gate.ts mode --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            echo "audit-mode=report" >> "$GITHUB_OUTPUT"
          fi
      - name: Compute downstream flags
        id: compute
        env:
          CORE: ${{ steps.override.outputs.full || steps.filter.outputs.core-foundation }}
          RUNTIME: ${{ steps.override.outputs.full || steps.filter.outputs.aztec-runtime }}
          BRIDGE: ${{ steps.override.outputs.full || steps.filter.outputs.wallet-bridge }}
          EXTENSION: ${{ steps.override.outputs.full || steps.filter.outputs.extension }}
          LANDING: ${{ steps.override.outputs.full || steps.filter.outputs.landing }}
          WORKFLOWS: ${{ steps.override.outputs.full || steps.filter.outputs.workflows }}
          ROOT: ${{ steps.override.outputs.full || steps.filter.outputs.root-config }}
        run: |
          if [ "$CORE" = "true" ] || [ "$RUNTIME" = "true" ] || [ "$BRIDGE" = "true" ] \
             || [ "$EXTENSION" = "true" ] || [ "$WORKFLOWS" = "true" ] || [ "$ROOT" = "true" ]; then
            echo "needs-extension-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs-extension-build=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$LANDING" = "true" ] || [ "$WORKFLOWS" = "true" ] || [ "$ROOT" = "true" ]; then
            echo "needs-landing-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs-landing-build=false" >> "$GITHUB_OUTPUT"
          fi

  commitlint:
    name: Commitlint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Lint PR commits
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$BASE_REF" = "main" ]; then
            # Skip on promote / Release PRs to main. The two kinds of main PR:
            #  - the promote PR, whose merge subject is a
            #    "release: promote dev -> main (...)" release-note line (mandated
            #    by CLAUDE.md) — `release` is an allowed type, but the line can
            #    run past the 100-char header cap;
            #  - the bot Release PR, whose "chore(main): release X.Y.Z" is
            #    reliably conventional anyway.
            # And the dev squash subjects in base..head are already-merged +
            # immutable — re-linting them spuriously failed required Quality on
            # long historical subjects. So commitlint adds no value on main.
            echo "commitlint: skipped on PRs to main (promote/Release subjects are exempt by design)."
          elif [ "${HEAD_REF#sync/main-to-dev}" != "$HEAD_REF" ]; then
            # Skip on the main->dev sync PR (head branch `sync/main-to-dev*`). It
            # is MERGE-committed (not squashed) so main's release commit stays in
            # dev's ancestry — the prerelease version-anchor needs it. That makes
            # base..head carry main's IMMUTABLE, already-merged release/promote
            # history (the same >100-char "release: promote ..." subjects the
            # main skip above exempts) → re-linting them spuriously reds required
            # Quality. The one NEW commit the sync adds (the manifest re-baseline)
            # is bot-generated and reliably conventional. Same rationale, dev side.
            echo "commitlint: skipped on the main->dev sync PR ($HEAD_REF) — carries main's immutable history; the one new commit (manifest re-baseline) is bot-conventional."
          else
            bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          fi

  lint-and-typecheck:
    name: Lint + Typecheck
    needs: changes
    uses: ./.github/workflows/_lint-and-typecheck.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      audit_mode: ${{ needs.changes.outputs.audit-mode }}

  unit-tests:
    name: Unit tests
    needs: changes
    uses: ./.github/workflows/_unit-tests.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}

  build-chrome:
    name: Build Chrome
    needs: changes
    if: needs.changes.outputs.needs-extension-build == 'true'
    uses: ./.github/workflows/_build-extension.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      target: chrome
      upload_artifacts: true
      version_suffix: ${{ github.event.pull_request.number && format('pr.{0}', github.event.pull_request.number) || '' }}

  build-firefox:
    name: Build Firefox
    needs: changes
    # Chrome's condition: the preview comment links both targets, and a release builds both.
    if: needs.changes.outputs.needs-extension-build == 'true'
    uses: ./.github/workflows/_build-extension.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      target: firefox
      upload_artifacts: true
      version_suffix: ${{ github.event.pull_request.number && format('pr.{0}', github.event.pull_request.number) || '' }}

  # The extension builds above are workflow artifacts nobody finds from the PR. This job keeps ONE
  # sticky comment on the PR pointing at them, edited in place on every push, the way a Cloudflare
  # preview comment does for a site. The script re-reads the PR head right before writing and
  # leaves the comment alone when the PR has moved on, so a slow run cannot overwrite a newer one.
  # Same-repo PRs only: a fork's token is read-only. Advisory twice over — not in quality-status's
  # needs, and continue-on-error so a comment failure cannot red the run either.
  preview-comment:
    name: Preview build comment
    needs: [changes, build-chrome, build-firefox]
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.changes.outputs.needs-extension-build == 'true'
      && needs.build-chrome.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The head sha, not the merge commit the default checkout gives a pull_request run: the version
      # printed must be the one the builds (also checked out at head.sha) stamped.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            /package.json
            /scripts/ci-cd/
            /apps/extension/package.json
          sparse-checkout-cone-mode: false
      # The script has no dependencies, so no `bun install` (and no setup-bun composite, which
      # always installs). The Bun line is read from root package.json's `packageManager` — not a
      # third pin site.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Upsert the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHROME_RESULT: ${{ needs.build-chrome.result }}
          CHROME_URL: ${{ needs.build-chrome.outputs.chrome_artifact_url }}
          FIREFOX_RESULT: ${{ needs.build-firefox.result }}
          FIREFOX_URL: ${{ needs.build-firefox.outputs.firefox_artifact_url }}
        # The head's bunfig.toml is not checked out, and may predate its auto-install refusal anyway.
        run: |
          PREVIEW_VERSION="$(bun --no-install -e "console.log(require('./apps/extension/package.json').version)")-pr.${PR_NUMBER}"
          export PREVIEW_VERSION
          bun --no-install scripts/ci-cd/preview-comment.ts

  # The landing deploys from Cloudflare's own Git integration, so without this job the first
  # build of a change is the production one. `bun run build` is the production build: `prebuild`
  # generates the legal pages from legal/*.md, and nothing in it reaches the network.
  build-landing:
    name: Build Landing
    needs: changes
    if: needs.changes.outputs.needs-landing-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: ./.github/actions/setup-bun
      - name: Build
        working-directory: apps/landing
        run: bun run build
      - name: Verify the legal pages shipped
        working-directory: apps/landing
        run: |
          for f in terms.html privacy.html terms/v1.0/index.html privacy/v1.0/index.html; do
            test -s "dist/$f" || { echo "::error::missing dist/$f"; exit 1; }
          done

  # Every story lives under the extension build's filter, so that flag decides this job too.
  build-storybook:
    name: Build Storybook
    needs: changes
    if: needs.changes.outputs.needs-extension-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: ./.github/actions/setup-bun
      - name: Build
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
        run: bun run --cwd apps/extension build-storybook

  # A stable release at or above 1.0.0 is a launch: a promote or Release PR into main at such a version
  # must leave no «FILL» in the legal documents, while dev stays open to legal drafts. A retarget
  # starts no run here, so auto-unstick repeats the check before it creates a stable tag.
  launch-legal:
    name: Launch legal check
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup-bun
      - name: Refuse a launch with a blank in the legal documents
        working-directory: packages/legal
        env:
          NULO_LAUNCH_GATE: "1"
        run: bun run test src/launch.test.ts

  # Extension smoke e2e lives in its own pr-extension-smoke-e2e.yml workflow:
  # auto-runs on PRs to main, on changes within the `smoke-surface`
  # filter, or via the `e2e:extension-smoke` label. Mirrors pr-extension-network-e2e.yml.

  status:
    name: quality-status
    if: always()
    needs: [changes, commitlint, lint-and-typecheck, unit-tests, build-chrome, build-firefox, build-landing, build-storybook, launch-legal]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate results
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EXTENSION_BUILD: ${{ needs.changes.outputs.needs-extension-build }}
          LANDING_BUILD: ${{ needs.changes.outputs.needs-landing-build }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          COMMITLINT_RESULT: ${{ needs.commitlint.result }}
          LINT_AND_TYPECHECK_RESULT: ${{ needs.lint-and-typecheck.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          BUILD_CHROME_RESULT: ${{ needs.build-chrome.result }}
          BUILD_FIREFOX_RESULT: ${{ needs.build-firefox.result }}
          BUILD_LANDING_RESULT: ${{ needs.build-landing.result }}
          BUILD_STORYBOOK_RESULT: ${{ needs.build-storybook.result }}
          LAUNCH_LEGAL_RESULT: ${{ needs.launch-legal.result }}
        run: |
          # An exact state machine, not a denylist: each gate must end as its own `if:` says,
          # `success` where it held and `skipped` where it did not, so a gate that never ran
          # (skipped for the wrong reason, cancelled before a runner, an empty result) fails here.
          expect() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1 is '$2', expected '$3'"
              exit 1
            fi
          }
          bool() {
            case "$2" in
              true | false) ;;
              *) echo "::error::$1 is not true/false: '$2'"; exit 1 ;;
            esac
          }
          ran() { if [ "$1" = true ]; then echo success; else echo skipped; fi }
          expect changes "$CHANGES_RESULT" success
          bool needs-extension-build "$EXTENSION_BUILD"
          bool needs-landing-build "$LANDING_BUILD"
          pull_request=false
          if [ "$EVENT" = pull_request ]; then pull_request=true; fi
          into_main=false
          if [ "$pull_request" = true ] && [ "$BASE_REF" = main ]; then into_main=true; fi
          expect commitlint "$COMMITLINT_RESULT" "$(ran "$pull_request")"
          expect lint-and-typecheck "$LINT_AND_TYPECHECK_RESULT" success
          expect unit-tests "$UNIT_TESTS_RESULT" success
          expect build-chrome "$BUILD_CHROME_RESULT" "$(ran "$EXTENSION_BUILD")"
          expect build-firefox "$BUILD_FIREFOX_RESULT" "$(ran "$EXTENSION_BUILD")"
          expect build-landing "$BUILD_LANDING_RESULT" "$(ran "$LANDING_BUILD")"
          expect build-storybook "$BUILD_STORYBOOK_RESULT" "$(ran "$EXTENSION_BUILD")"
          expect launch-legal "$LAUNCH_LEGAL_RESULT" "$(ran "$into_main")"
          echo "Every gate ended as its condition asks (a build whose filter did not trip is skipped)."
