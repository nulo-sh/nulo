# Firefox twin of pr-extension-network-e2e.yml: its aggregator is required on dev (advisory on main; promotion:
# CLAUDE.md, "Staged-rollout switches"). scripts/ci-cd/behavior-gating.test.ts pins the parity.
name: Extension network e2e (Firefox)

on:
  workflow_dispatch:
    inputs:
      disable_presto:
        description: "Skip presto-server for this manual run (investigation override)"
        required: false
        type: boolean
        default: false
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

concurrency:
  # One queue per head commit, so a late run of an older push can neither cancel nor replace the
  # current head's run; pr-supersede.yml cancels the runs of heads the pull request moved past.
  group: pr-extension-network-e2e-firefox-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # dorny/paths-filter reads the PR's file list through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      extension-network: ${{ steps.override.outputs.full || steps.filter.outputs.extension-network }}
      label-hit: ${{ steps.live.outputs.label-hit }}
      base: ${{ steps.live.outputs.base }}
      read-attempt: ${{ steps.live.outputs.read-attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read the live labels and head
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-cd/live-labels.sh e2e:extension-network e2e:network
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          filters: |
            extension-network:
              - 'apps/extension/**'
              - 'apps/playground/**'
              - 'packages/aztec-runtime/src/**'
              - 'packages/aztec-runtime/package.json'
              - 'packages/design/src/**'
              - 'packages/design/package.json'
              - 'packages/extension-messaging/src/**'
              - 'packages/extension-messaging/package.json'
              - 'packages/legal/src/**'
              - 'packages/legal/package.json'
              - 'packages/resolve-asset/src/**'
              - 'packages/resolve-asset/package.json'
              - 'packages/third-party-notices/src/**'
              - 'packages/third-party-notices/package.json'
              - 'packages/wallet-bridge/src/**'
              - 'packages/wallet-bridge/package.json'
              - 'packages/wallet-core/src/**'
              - 'packages/wallet-core/package.json'
              - 'packages/wallet-crypto/src/**'
              - 'packages/wallet-crypto/package.json'
              - 'packages/wallet-sdk-schema-patch/src/**'
              - 'packages/wallet-sdk-schema-patch/package.json'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'patches/**'
              - '.github/workflows/_extension-network-e2e.yml'
              - '.github/workflows/pr-extension-network-e2e-firefox.yml'
              - '.github/actions/setup-aztec/**'
              - '.github/actions/setup-presto-server/**'
              - '.github/actions/setup-bun/**'
              - '.github/actions/setup-puppeteer/**'
              - '.github/actions/setup-geckodriver/**'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "full=true" >> "$GITHUB_OUTPUT"

  decide:
    name: Decide
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ needs.changes.outputs.base }}
          NETWORK: ${{ needs.changes.outputs.extension-network }}
          LABEL_HIT: ${{ needs.changes.outputs.label-hit }}
        run: |
          case "$LABEL_HIT" in
            true | false) ;;
            *) echo "::error::changes.outputs.label-hit is not true/false: '$LABEL_HIT'"; exit 1 ;;
          esac
          if [ "$EVENT" = pull_request ] && [ -z "$BASE" ]; then
            echo "::error::changes.outputs.base is empty"
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ] \
             || [ "$BASE" = "main" ] \
             || [ "$LABEL_HIT" = "true" ] \
             || [ "$NETWORK" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  network-e2e:
    name: Run / shard ${{ matrix.shard.id }}
    needs: decide
    if: needs.decide.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { id: "1/5", label: "1-of-5" }
          - { id: "2/5", label: "2-of-5" }
          - { id: "3/5", label: "3-of-5" }
          - { id: "4/5", label: "4-of-5" }
          - { id: "5/5", label: "5-of-5" }
    uses: ./.github/workflows/_extension-network-e2e.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      browser: firefox
      shard: ${{ matrix.shard.id }}
      shard_label: ${{ matrix.shard.label }}
      retry: "0"
      exclude_files: "tests/e2e/network/fee-methods.test.ts tests/e2e/network/selfpay-phase.test.ts tests/e2e/network/concurrent-sendtx-confirm.test.ts tests/e2e/network/transfers.test.ts tests/e2e/network/tx-sendTx-default.test.ts tests/e2e/network/frozen-account-canary.test.ts tests/e2e/network/passkey-execution-canary.test.ts tests/e2e/network/delete-after-prove.test.ts tests/e2e/network/same-token-concurrent-sends.test.ts"
      proverless: true

  network-e2e-heavy:
    name: Run / heavy / fee-methods + selfpay-phase
    needs: decide
    if: needs.decide.outputs.run == 'true'
    uses: ./.github/workflows/_extension-network-e2e.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      browser: firefox
      shard_label: "heavy"
      retry: "0"
      test_files: "tests/e2e/network/fee-methods.test.ts tests/e2e/network/selfpay-phase.test.ts"
      proverless: true

  network-e2e-heavy-concurrent:
    name: Run / heavy / concurrent-confirm
    needs: decide
    if: needs.decide.outputs.run == 'true'
    uses: ./.github/workflows/_extension-network-e2e.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      browser: firefox
      shard_label: "heavy-concurrent"
      retry: "0"
      test_files: "tests/e2e/network/concurrent-sendtx-confirm.test.ts tests/e2e/network/same-token-concurrent-sends.test.ts"
      proverless: true

  network-e2e-canary:
    name: Run / canary / real-proving
    needs: decide
    if: needs.decide.outputs.run == 'true'
    uses: ./.github/workflows/_extension-network-e2e.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      browser: firefox
      shard_label: "canary"
      retry: "0"
      test_files: "tests/e2e/network/transfers.test.ts tests/e2e/network/tx-sendTx-default.test.ts tests/e2e/network/frozen-account-canary.test.ts tests/e2e/network/passkey-execution-canary.test.ts tests/e2e/network/delete-after-prove.test.ts"
      disable_presto: ${{ github.event.inputs.disable_presto == 'true' || vars.NULO_E2E_DISABLE_PRESTO == '1' }}

  status:
    name: extension-network-e2e-firefox-status
    if: always()
    needs: [changes, decide, network-e2e, network-e2e-heavy, network-e2e-heavy-concurrent, network-e2e-canary]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate results
        run: |
          RUN="${{ needs.decide.outputs.run }}"
          for r in "${{ needs.changes.result }}" "${{ needs.decide.result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::A gate-control job did not succeed: $r"
              exit 1
            fi
          done
          case "$RUN" in
            true) want="success" ;;
            false) want="skipped" ;;
            *) echo "::error::decide.outputs.run is not true/false: '$RUN'"; exit 1 ;;
          esac
          # A partial re-run carries an earlier attempt's gate over, so a skip stands only on labels
          # read in this attempt.
          if [ "$RUN" = false ] && [ "${{ needs.changes.outputs.read-attempt }}" != "${{ github.run_attempt }}" ]; then
            echo "::error::the suites were skipped on labels read at attempt '${{ needs.changes.outputs.read-attempt }}', not this one: re-run all jobs"
            exit 1
          fi
          for r in \
            "${{ needs.network-e2e.result }}" \
            "${{ needs.network-e2e-heavy.result }}" \
            "${{ needs.network-e2e-heavy-concurrent.result }}" \
            "${{ needs.network-e2e-canary.result }}" \
          ; do
            if [ "$r" != "$want" ]; then
              echo "::error::gate said run=$RUN, so every suite job must be '$want' — got '$r'"
              exit 1
            fi
          done
          echo "Extension network e2e (Firefox) gate passed (or was skipped — no relevant changes / not labeled)."
