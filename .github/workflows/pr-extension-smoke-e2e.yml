name: Extension smoke e2e

on:
  workflow_dispatch:
  pull_request:
    # NO `branches:` filter — see pr-quick.yml: that key filters on the PR's BASE,
    # so a stacked PR targeting its parent feature branch got no CI whatsoever.
    # `labeled` so adding `e2e:extension-smoke` (`e2e:smoke` is honored as an alias) after open triggers a fresh run;
    # `unlabeled` so removing it re-evaluates the gate instead of leaving
    # a stale failing result; `ready_for_review` gives a draft marked ready a fresh
    # run on its head (no gate reads the draft flag, so the head normally has a run
    # already; this one can replace a run that failed, was cancelled or never started).
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

concurrency:
  # One queue per head commit, so a late run of an older push can neither cancel nor replace the
  # current head's run; pr-supersede.yml cancels the runs of heads the pull request moved past.
  group: pr-extension-smoke-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.gate.outputs.run }}
      read-attempt: ${{ steps.live.outputs.read-attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: paths-filter needs the merge-base with the comparison
          # branch. On a shallow clone it falls back to a `fetch --deepen` loop,
          # which hits git's "shallow file has changed since we read it" race
          # whenever the merge-base sits beyond the initial depth (structural on
          # long-running branches ~100+ commits from the base).
          fetch-depth: 0
      - name: Read the live labels and head
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-cd/live-labels.sh e2e:extension-smoke e2e:smoke
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          filters: |
            smoke-surface:
              # Derived from the extension dependency graph (see CI.md "CI gating").
              # Whole-package for the built target (covers src/manifest/public/scripts/
              # vite/tsconfig + the e2e harness — can't miss a build input); src + the
              # package manifest for each dependency library. NO `!` negations (the dorny
              # `some`-quantifier footgun). Pinned by scripts/ci-cd/behavior-gating.test.ts.
              # Built target — extension (whole package):
              - 'apps/extension/**'
              # Dependency libraries — consumed source + manifest:
              - 'packages/aztec-runtime/src/**'
              - 'packages/aztec-runtime/package.json'
              - 'packages/design/src/**'
              - 'packages/design/package.json'
              - 'packages/extension-messaging/src/**'
              - 'packages/extension-messaging/package.json'
              - 'packages/legal/src/**'
              - 'packages/legal/package.json'
              - 'packages/resolve-asset/src/**'
              - 'packages/resolve-asset/package.json'
              - 'packages/third-party-notices/src/**'
              - 'packages/third-party-notices/package.json'
              - 'packages/token-list/src/**'
              - 'packages/token-list/package.json'
              - 'packages/third-party-notices/texts/**'
              - 'packages/wallet-bridge/src/**'
              - 'packages/wallet-bridge/package.json'
              - 'packages/wallet-core/src/**'
              - 'packages/wallet-core/package.json'
              - 'packages/wallet-crypto/src/**'
              - 'packages/wallet-crypto/package.json'
              - 'packages/wallet-sdk-schema-patch/src/**'
              - 'packages/wallet-sdk-schema-patch/package.json'
              # Repo-wide build inputs:
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'patches/**'
              # Smoke workflow + composite actions:
              - '.github/workflows/_extension-smoke-e2e.yml'
              - '.github/workflows/_build-extension.yml'
              - '.github/workflows/pr-extension-smoke-e2e.yml'
              - 'scripts/ci-cd/e2e-decide.sh'
              - 'scripts/ci-cd/e2e-aggregate.sh'
              - '.github/actions/setup-bun/**'
              - '.github/actions/setup-puppeteer/**'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "full=true" >> "$GITHUB_OUTPUT"

      - name: Decide
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.live.outputs.base }}
          LABEL_HIT: ${{ steps.live.outputs.label-hit }}
          SURFACE: ${{ steps.override.outputs.full || steps.filter.outputs.smoke-surface }}
        run: bash scripts/ci-cd/e2e-decide.sh

  # PR smoke builds IN-JOB (no artifact): the in-job build arms the migration fixture (artifact
  # runs skip those e2es by the arming contract - they were silently skipped on PRs before).
  # Prod-shaped build coverage on PRs stays with
  # the quality lane's `Build / vite build (chrome)`; the RELEASE chain still smokes the real
  # artifact (prod-shaped by design - its chain-adjacent legs are the known queued follow-up).
  smoke:
    name: Run / shard ${{ matrix.shard.id }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      # Every shard reports, so one red shard never hides another's result.
      fail-fast: false
      matrix:
        # Three shards keep the slowest one under half the 30-minute limit on Firefox, whose whole
        # run reaches ~26m on a slow runner. Vitest assigns files by the SHA-1 of their path, so
        # the split is fixed, and uneven. `label` is `id` without the `/` upload-artifact rejects.
        shard:
          - { id: "1/3", label: "1-of-3" }
          - { id: "2/3", label: "2-of-3" }
          - { id: "3/3", label: "3-of-3" }
    uses: ./.github/workflows/_extension-smoke-e2e.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      shard: ${{ matrix.shard.id }}
      shard_label: ${{ matrix.shard.label }}

  status:
    name: extension-smoke-e2e-status
    if: always()
    needs: [changes, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The commit this run's workflow file came from, so the script is the one this file was written
      # against. A failed fetch reds the check: it is never green without the evaluation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: /scripts/ci-cd/e2e-aggregate.sh
          sparse-checkout-cone-mode: false
      - name: Aggregate results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash scripts/ci-cd/e2e-aggregate.sh
