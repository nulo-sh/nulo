# Firefox twin of pr-extension-smoke-e2e.yml: its aggregator is required on dev and main (CLAUDE.md,
# "Staged-rollout switches"). scripts/ci-cd/behavior-gating.test.ts pins the parity.
name: Extension smoke e2e (Firefox)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

concurrency:
  # One queue per head commit, so a late run of an older push can neither cancel nor replace the
  # current head's run; pr-supersede.yml cancels the runs of heads the pull request moved past.
  group: pr-extension-smoke-e2e-firefox-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # dorny/paths-filter reads the PR's file list through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      smoke-surface: ${{ steps.override.outputs.full || steps.filter.outputs.smoke-surface }}
      label-hit: ${{ steps.live.outputs.label-hit }}
      base: ${{ steps.live.outputs.base }}
      read-attempt: ${{ steps.live.outputs.read-attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read the live labels and head
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-cd/live-labels.sh e2e:extension-smoke e2e:smoke
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          filters: |
            smoke-surface:
              - 'apps/extension/**'
              - 'packages/aztec-runtime/src/**'
              - 'packages/aztec-runtime/package.json'
              - 'packages/design/src/**'
              - 'packages/design/package.json'
              - 'packages/extension-messaging/src/**'
              - 'packages/extension-messaging/package.json'
              - 'packages/legal/src/**'
              - 'packages/legal/package.json'
              - 'packages/resolve-asset/src/**'
              - 'packages/resolve-asset/package.json'
              - 'packages/third-party-notices/src/**'
              - 'packages/third-party-notices/package.json'
              - 'packages/third-party-notices/texts/**'
              - 'packages/wallet-bridge/src/**'
              - 'packages/wallet-bridge/package.json'
              - 'packages/wallet-core/src/**'
              - 'packages/wallet-core/package.json'
              - 'packages/wallet-crypto/src/**'
              - 'packages/wallet-crypto/package.json'
              - 'packages/wallet-sdk-schema-patch/src/**'
              - 'packages/wallet-sdk-schema-patch/package.json'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'patches/**'
              - '.github/workflows/_extension-smoke-e2e.yml'
              - '.github/workflows/_build-extension.yml'
              - '.github/workflows/pr-extension-smoke-e2e-firefox.yml'
              - '.github/actions/setup-bun/**'
              - '.github/actions/setup-puppeteer/**'
              - '.github/actions/setup-geckodriver/**'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "full=true" >> "$GITHUB_OUTPUT"

  decide:
    name: Decide
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ needs.changes.outputs.base }}
          SMOKE: ${{ needs.changes.outputs.smoke-surface }}
          LABEL_HIT: ${{ needs.changes.outputs.label-hit }}
        run: |
          case "$LABEL_HIT" in
            true | false) ;;
            *) echo "::error::changes.outputs.label-hit is not true/false: '$LABEL_HIT'"; exit 1 ;;
          esac
          if [ "$EVENT" = pull_request ] && [ -z "$BASE" ]; then
            echo "::error::changes.outputs.base is empty"
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ] \
             || [ "$BASE" = "main" ] \
             || [ "$LABEL_HIT" = "true" ] \
             || [ "$SMOKE" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    name: Run / shard ${{ matrix.shard.id }}
    needs: [decide]
    if: needs.decide.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { id: "1/3", label: "1-of-3" }
          - { id: "2/3", label: "2-of-3" }
          - { id: "3/3", label: "3-of-3" }
    uses: ./.github/workflows/_extension-smoke-e2e.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      shard: ${{ matrix.shard.id }}
      shard_label: ${{ matrix.shard.label }}
      browser: firefox

  status:
    name: extension-smoke-e2e-firefox-status
    if: always()
    needs: [changes, decide, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate results
        run: |
          RUN="${{ needs.decide.outputs.run }}"
          for r in "${{ needs.changes.result }}" "${{ needs.decide.result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::A gate-control job did not succeed: $r"
              exit 1
            fi
          done
          case "$RUN" in
            true) want="success" ;;
            false) want="skipped" ;;
            *) echo "::error::decide.outputs.run is not true/false: '$RUN'"; exit 1 ;;
          esac
          # A partial re-run carries an earlier attempt's gate over, so a skip stands only on labels
          # read in this attempt.
          if [ "$RUN" = false ] && [ "${{ needs.changes.outputs.read-attempt }}" != "${{ github.run_attempt }}" ]; then
            echo "::error::the suites were skipped on labels read at attempt '${{ needs.changes.outputs.read-attempt }}', not this one: re-run all jobs"
            exit 1
          fi
          if [ "${{ needs.smoke.result }}" != "$want" ]; then
            echo "::error::gate said run=$RUN, so the smoke suite must be '$want' — got '${{ needs.smoke.result }}'"
            exit 1
          fi
          echo "Extension smoke e2e (Firefox) gate passed (or was skipped — no relevant changes / not labeled)."
