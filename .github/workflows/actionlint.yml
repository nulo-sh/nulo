name: Lint workflows

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]

concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # On a PR only a push's first attempt cancels the run in flight. Any other PR event, and any
  # re-run of one, queues behind it: a run cancelled on its own head leaves a FAILURE aggregator
  # there (CI.md, "Concurrency").
  cancel-in-progress: ${{ github.event_name != 'pull_request' || (github.event.action == 'synchronize' && github.run_attempt == '1') }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      workflows: ${{ steps.override.outputs.workflows || steps.filter.outputs.workflows }}
      shell: ${{ steps.override.outputs.shell || steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
            shell:
              - 'apps/extension/scripts/**/*.sh'
              - 'apps/extension/scripts/**/*.bash'
              - 'scripts/**/*.sh'
              - 'scripts/**/*.bash'
              - '.githooks/**'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: |
          {
            echo "workflows=true"
            echo "shell=true"
          } >> "$GITHUB_OUTPUT"

  actionlint:
    name: Actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Replaces the prior `bash <(curl -fsSL ...download-actionlint.bash)` —
      # SHA-pinned Marketplace action eliminates the curl|bash supply-chain
      # surface. The action handles caching internally.
      - uses: reviewdog/action-actionlint@2085657ab2c7f48c58edcc767fba576f63bea76b # v1.77.0
        with:
          fail_on_error: true

  shellcheck:
    name: Shellcheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck
        run: |
          shopt -s globstar nullglob
          mapfile -t FILES < <(find .githooks apps/extension/scripts scripts -type f \( -name '*.sh' -o -name '*.bash' \) 2>/dev/null)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No shell files found to lint."
            exit 0
          fi
          shellcheck "${FILES[@]}"
        shell: bash

  status:
    name: Status
    if: always()
    needs: [changes, actionlint, shellcheck]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check results
        env:
          WORKFLOWS: ${{ needs.changes.outputs.workflows }}
          SHELL_FILES: ${{ needs.changes.outputs.shell }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          SHELLCHECK_RESULT: ${{ needs.shellcheck.result }}
        run: |
          # An exact state machine, not a denylist: a linter whose filter tripped must succeed and
          # one whose filter did not must be skipped, so a linter that never ran fails here.
          expect() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1 is '$2', expected '$3'"
              exit 1
            fi
          }
          bool() {
            case "$2" in
              true | false) ;;
              *) echo "::error::$1 is not true/false: '$2'"; exit 1 ;;
            esac
          }
          ran() { if [ "$1" = true ]; then echo success; else echo skipped; fi }
          expect changes "$CHANGES_RESULT" success
          bool workflows "$WORKFLOWS"
          bool shell "$SHELL_FILES"
          expect actionlint "$ACTIONLINT_RESULT" "$(ran "$WORKFLOWS")"
          expect shellcheck "$SHELLCHECK_RESULT" "$(ran "$SHELL_FILES")"
          echo "Every linter ended as its filter asks (skipped when nothing it reads changed)."
