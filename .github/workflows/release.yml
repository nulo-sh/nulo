name: release

# Two trigger paths:
#  - push to main: release-please-action maintains the Release PR and never tags or releases
#    (skip-github-release). Once the Release PR merges, auto-unstick tags its merge commit, and
#    the same run publishes: gates → build → smoke → notes → attach-assets, which creates the
#    GitHub Release as a draft, uploads and checks the assets, and only then publishes it. The
#    landing is a Worker that Workers Builds redeploys from pushes to main; no job here touches
#    it. The store uploads are opt-in workflow_dispatch inputs.
#  - workflow_dispatch: finish the release of an existing tag, dispatched with `--ref <tag>` so the
#    run's commit is the tagged one; or, from main, submit a published release to the stores,
#    which ship its own bytes, never a rebuild. Skips the release-please job.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Re-publish artifacts for an existing tag (e.g. v1.2.3). Skips release-please."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Skip the publish (tag check, draft, uploads, notes) and the store uploads. Build + gates still run."
        required: false
        type: boolean
        default: false
      run_network_e2e:
        description: "Run the network e2e gate, sharded as on a PR. Off by default; opt in for paranoid republishes. Only consulted on workflow_dispatch: a push to main never runs it."
        required: false
        type: boolean
        default: false
      publish_chrome:
        description: "Upload the Chrome zip to the Chrome Web Store (keyless: OIDC → Google WIF; environment chrome-web-store). Stable tags on main only."
        required: false
        type: boolean
        default: false
      publish_firefox:
        description: "Upload the Firefox zip to Firefox Add-ons (environment firefox-add-ons). Stable tags on main only."
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

# Least-privilege default: read-only for every job (covers checkout; artifact +
# cache ops don't need a `permissions:` scope). A job that writes escalates in its
# own block or mints a release App token, whose permissions release-integrity.test.ts pins.
permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Uses the App token for its writes (signing + CI cascade), but escalate the
    # job token too so the action is robust if it ever falls back to GITHUB_TOKEN.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # App-authenticated token: ensures (a) the Release PR's commits are
      # bot-verified (satisfies main's "signed commits required" rule), and
      # (b) the PR's pull_request event triggers normal CI (GITHUB_TOKEN
      # would suppress downstream workflow runs). Every mint names its permissions,
      # so a permission later granted to the App does not reach this token.
      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
          # Explicit target. Without this release-please-action defaults to
          # the repo's default branch (`dev`), which would open Release PRs
          # against dev with a malformed title (component+version both miss).
          target-branch: main
          # release-please only maintains Release PRs: auto-unstick is the one tag creator, and
          # attach-assets the one release creator, which publishes only after the assets check out.
          skip-github-release: true
          token: ${{ steps.app.outputs.token }}

  # ADVISORY, like sync-main-to-dev: nothing waits on it, so a red run never holds a release.
  release-pr-lockfile:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    uses: ./.github/workflows/_release-pr-lockfile.yml
    with:
      pr: ${{ needs.release-please.outputs.pr }}
    secrets:
      RELEASE_PLEASE_APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
      RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

  # release-please never tags (skip-github-release; its own publish path also aborts on
  # its known bug), so after a Release PR merges release_created stays false and the
  # whole publish chain below skips (the documented manual unstick exists for exactly
  # this). This job detects that precise state — a
  # MERGED `autorelease: pending` Release PR whose merge commit IS github.sha (an
  # explicit PR-to-SHA check, never a title heuristic) — creates the tag itself (or
  # finds the one an earlier attempt created), and feeds `resolve` so the chain
  # continues. All logic + guards live in unit-tested scripts/release/auto-unstick*.ts.
  # vars.AUTO_UNSTICK_ENABLED is the kill switch: off/false/0 or an unrecognised value makes the
  # script no-op (unstuck=false), resolve stays skipped, and the manual unstick applies. Unset is on.
  auto-unstick:
    needs: release-please
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Every write goes through the App token, so the release App is the tag's creator.
    permissions:
      contents: read
    outputs:
      unstuck: ${{ steps.u.outputs.unstuck }}
      tag_name: ${{ steps.u.outputs.tag_name }}
    steps:
      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          cache: "false"
          install: "false"
      - id: u
        env:
          AUTO_UNSTICK_ENABLED: ${{ vars.AUTO_UNSTICK_ENABLED }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bun scripts/release/auto-unstick-run.ts

  # Translate either trigger path into the same {tag, version, sha, is_prerelease}
  # outputs that downstream jobs consume. Runs on every workflow_dispatch (the
  # script fails loudly on empty tag) and, on a push, only once auto-unstick has
  # tagged. Its release_created branch is unreachable while release-please runs with
  # skip-github-release, which release-integrity.test.ts pins.
  resolve:
    needs: [release-please, auto-unstick]
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true'
        || needs.auto-unstick.outputs.unstuck == 'true'
        || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
      sha: ${{ steps.r.outputs.sha }}
      is_prerelease: ${{ steps.r.outputs.is_prerelease }}
      # The dispatch ref authenticates the WORKFLOW FILE, not the tag it checks out: without this
      # output a tag on any branch could supply the script that runs with a store credential.
      on_main: ${{ steps.r.outputs.on_main }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: r
        env:
          TAG_FROM_PLEASE: ${{ needs.release-please.outputs.tag_name }}
          TAG_FROM_UNSTICK: ${{ needs.auto-unstick.outputs.tag_name }}
          TAG_FROM_INPUT: ${{ github.event.inputs.tag }}
          IS_PUSH: ${{ github.event_name == 'push' }}
        run: |
          if [ "$IS_PUSH" = "true" ]; then
            # release-please's tag on the happy path; the auto-unstick's tag on the abort path.
            TAG="${TAG_FROM_PLEASE:-$TAG_FROM_UNSTICK}"
          else
            TAG="$TAG_FROM_INPUT"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved — workflow_dispatch requires the 'tag' input (e.g. v1.2.3), and push events need release-please to have created a release."
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG not found in repo (fetch-tags should have brought it; was the release-please commit pushed?)"
            exit 1
          fi
          SHA=$(git rev-list -n 1 "$TAG")
          VERSION="${TAG#v}"
          IS_PRE="false"
          case "$VERSION" in *-*) IS_PRE="true" ;; esac
          # true/false, never an abort: resolve also serves releases that publish to no store.
          ON_MAIN="false"
          if git merge-base --is-ancestor "$SHA" origin/main; then ON_MAIN="true"; fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "sha=$SHA"
            echo "is_prerelease=$IS_PRE"
            echo "on_main=$ON_MAIN"
          } >> "$GITHUB_OUTPUT"
          # Written before any protected job asks for approval, so the approver sees what would ship.
          {
            echo "## resolve"
            echo "- tag: \`$TAG\`"
            echo "- sha: \`$SHA\`"
            echo "- prerelease: $IS_PRE"
            echo "- on main: $ON_MAIN"
          } >> "$GITHUB_STEP_SUMMARY"

  # A skipped ancestor anywhere in the needs chain (release-please on workflow_dispatch) skips
  # every descendant unless its `if` starts with `always()`; each result is then checked by hand.
  lint-and-typecheck:
    needs: resolve
    if: always() && needs.resolve.result == 'success'
    uses: ./.github/workflows/_lint-and-typecheck.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  unit-tests:
    needs: resolve
    if: always() && needs.resolve.result == 'success'
    uses: ./.github/workflows/_unit-tests.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  network-e2e:
    name: Run / ${{ matrix.leg.name }}
    needs: resolve
    # Network-e2e firing rule: OPT-IN ONLY (workflow_dispatch with
    # `run_network_e2e=true`). It does not run on the auto push:main publish —
    # the promote dev→main PR already gates the exact code with the full network
    # suite before it reaches main, so re-running the flaky suite on the
    # publish would only duplicate that gate AND could strand a release: a network-e2e
    # cancellation/timeout on push:main would take the whole run down before the publish
    # (leaving a tag with no release). The publish still gates on smoke-against-artifact (real
    # built zip). Pass run_network_e2e=true on a manual republish if you want the extra
    # network pass.
    if: |
      always() &&
      needs.resolve.result == 'success' &&
      github.event.inputs.run_network_e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The PR lane's jobs (pr-extension-network-e2e.yml) as legs of ONE matrix job, its shard
        # pool spelled out per shard: attach-assets and status read the whole suite as this job's
        # single result, which is `success` only when every leg succeeded. A leg's inputs are the
        # PR job's; scripts/ci-cd/behavior-gating.test.ts pins the two, leg for job.
        leg:
          - name: shard 1/5
            shard: "1/5"
            shard_label: 1-of-5
            test_files: ""
            exclude_files: "tests/e2e/network/fee-methods.test.ts tests/e2e/network/selfpay-phase.test.ts tests/e2e/network/concurrent-sendtx-confirm.test.ts tests/e2e/network/transfers.test.ts tests/e2e/network/tx-sendTx-default.test.ts tests/e2e/network/frozen-account-canary.test.ts tests/e2e/network/passkey-execution-canary.test.ts tests/e2e/network/delete-after-prove.test.ts tests/e2e/network/same-token-concurrent-sends.test.ts"
            proverless: true
          - name: shard 2/5
            shard: "2/5"
            shard_label: 2-of-5
            test_files: ""
            exclude_files: "tests/e2e/network/fee-methods.test.ts tests/e2e/network/selfpay-phase.test.ts tests/e2e/network/concurrent-sendtx-confirm.test.ts tests/e2e/network/transfers.test.ts tests/e2e/network/tx-sendTx-default.test.ts tests/e2e/network/frozen-account-canary.test.ts tests/e2e/network/passkey-execution-canary.test.ts tests/e2e/network/delete-after-prove.test.ts tests/e2e/network/same-token-concurrent-sends.test.ts"
            proverless: true
          - name: shard 3/5
            shard: "3/5"
            shard_label: 3-of-5
            test_files: ""
            exclude_files: "tests/e2e/network/fee-methods.test.ts tests/e2e/network/selfpay-phase.test.ts tests/e2e/network/concurrent-sendtx-confirm.test.ts tests/e2e/network/transfers.test.ts tests/e2e/network/tx-sendTx-default.test.ts tests/e2e/network/frozen-account-canary.test.ts tests/e2e/network/passkey-execution-canary.test.ts tests/e2e/network/delete-after-prove.test.ts tests/e2e/network/same-token-concurrent-sends.test.ts"
            proverless: true
          - name: shard 4/5
            shard: "4/5"
            shard_label: 4-of-5
            test_files: ""
            exclude_files: "tests/e2e/network/fee-methods.test.ts tests/e2e/network/selfpay-phase.test.ts tests/e2e/network/concurrent-sendtx-confirm.test.ts tests/e2e/network/transfers.test.ts tests/e2e/network/tx-sendTx-default.test.ts tests/e2e/network/frozen-account-canary.test.ts tests/e2e/network/passkey-execution-canary.test.ts tests/e2e/network/delete-after-prove.test.ts tests/e2e/network/same-token-concurrent-sends.test.ts"
            proverless: true
          - name: shard 5/5
            shard: "5/5"
            shard_label: 5-of-5
            test_files: ""
            exclude_files: "tests/e2e/network/fee-methods.test.ts tests/e2e/network/selfpay-phase.test.ts tests/e2e/network/concurrent-sendtx-confirm.test.ts tests/e2e/network/transfers.test.ts tests/e2e/network/tx-sendTx-default.test.ts tests/e2e/network/frozen-account-canary.test.ts tests/e2e/network/passkey-execution-canary.test.ts tests/e2e/network/delete-after-prove.test.ts tests/e2e/network/same-token-concurrent-sends.test.ts"
            proverless: true
          - name: heavy / fee-methods + selfpay-phase
            shard: ""
            shard_label: heavy
            test_files: "tests/e2e/network/fee-methods.test.ts tests/e2e/network/selfpay-phase.test.ts"
            exclude_files: ""
            proverless: true
          - name: heavy / concurrent-confirm
            shard: ""
            shard_label: heavy-concurrent
            test_files: "tests/e2e/network/concurrent-sendtx-confirm.test.ts tests/e2e/network/same-token-concurrent-sends.test.ts"
            exclude_files: ""
            proverless: true
          - name: canary / real-proving
            shard: ""
            shard_label: canary
            test_files: "tests/e2e/network/transfers.test.ts tests/e2e/network/tx-sendTx-default.test.ts tests/e2e/network/frozen-account-canary.test.ts tests/e2e/network/passkey-execution-canary.test.ts tests/e2e/network/delete-after-prove.test.ts"
            exclude_files: ""
            proverless: false
    uses: ./.github/workflows/_extension-network-e2e.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      shard: ${{ matrix.leg.shard }}
      shard_label: ${{ matrix.leg.shard_label }}
      retry: "0"
      test_files: ${{ matrix.leg.test_files }}
      exclude_files: ${{ matrix.leg.exclude_files }}
      proverless: ${{ matrix.leg.proverless }}
      # The PR lane's kill switch, minus its dispatch input; it only reaches the prover-ON leg.
      disable_presto: ${{ !matrix.leg.proverless && vars.NULO_E2E_DISABLE_PRESTO == '1' }}
    secrets:
      SPONSORED_FPC_SALT: ${{ secrets.SPONSORED_FPC_SALT }}

  build-chrome:
    needs: [resolve, lint-and-typecheck, unit-tests]
    if: always() && needs.resolve.result == 'success' && needs.lint-and-typecheck.result == 'success' && needs.unit-tests.result == 'success'
    uses: ./.github/workflows/_build-extension.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      target: chrome
      version_override: ${{ needs.resolve.outputs.version }}
      upload_artifacts: true

  build-firefox:
    needs: [resolve, lint-and-typecheck, unit-tests]
    if: always() && needs.resolve.result == 'success' && needs.lint-and-typecheck.result == 'success' && needs.unit-tests.result == 'success'
    uses: ./.github/workflows/_build-extension.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      target: firefox
      version_override: ${{ needs.resolve.outputs.version }}
      upload_artifacts: true

  smoke-against-artifact:
    needs: [resolve, build-chrome]
    if: always() && needs.resolve.result == 'success' && needs.build-chrome.result == 'success'
    uses: ./.github/workflows/_extension-smoke-e2e.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      artifact_name: extension-chrome

  # The shipped Firefox zip's contents, smoked on Firefox. attach-assets and status wait on it as
  # on the Chrome smoke, so a red or cancelled run holds this release's assets. An artifact run's
  # limit is 45 minutes (`_extension-smoke-e2e.yml`), plus any time queued for a runner.
  smoke-firefox-against-artifact:
    needs: [resolve, build-firefox]
    if: always() && needs.resolve.result == 'success' && needs.build-firefox.result == 'success'
    uses: ./.github/workflows/_extension-smoke-e2e.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      artifact_name: extension-firefox
      browser: firefox

  # git-cliff runs here, in a job that holds no write token and signs nothing: its action downloads
  # the git-cliff binary at run time. The notes reach attach-assets as an artifact, as plain text.
  release-notes:
    needs: resolve
    if: always() && !cancelled() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The tag already exists when this job runs (auto-unstick or the manual unstick
      # creates it before the chain starts; a dispatch names an existing one), so
      # `--unreleased` finds nothing after it and would leave every body empty. The range
      # is chosen here by ancestry instead: a stable covers everything since the
      # previous stable, an rc everything since the previous rc or stable —
      # `git describe` takes the nearest such tag reachable from the release
      # commit's parent, so the nightly tags dev publishes daily (nightly.yml)
      # and git-cliff's own timestamp ordering never decide the boundary.
      - name: Pick the release-notes range
        env:
          IS_PRERELEASE: ${{ needs.resolve.outputs.is_prerelease }}
        run: |
          # The tag name reaches git-cliff's arguments through a shell, so only the two forms
          # release-please cuts here are accepted; the range itself is passed as commit ids.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc(\.[0-9]+)?)?$ ]] \
            || { echo "::error::release notes: tag ${TAG} is not a stable or rc tag"; exit 1; }
          exclude=(--exclude 'v*-nightly*' --exclude 'v*-internal*')
          [ "$IS_PRERELEASE" = "true" ] || exclude+=(--exclude 'v*-rc*')
          # Without any predecessor the range starts after the root commit, so a first release
          # (tagged on the root itself) has an empty range.
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${exclude[@]}" "${TAG}^" 2>/dev/null) \
            || prev=$(git rev-list --max-parents=0 "$TAG" | tail -n 1)
          {
            echo "CLIFF_RANGE=$(git rev-parse "${prev}^{commit}")..$(git rev-parse "${TAG}^{commit}")"
            # Only this tag exists for git-cliff, so no tag inside the range can split the notes.
            echo "CLIFF_TAG_PATTERN=^${TAG//./\\.}\$"
          } >> "$GITHUB_ENV"
          echo "release notes cover ${prev}..${TAG}"

      - name: Generate release notes (git-cliff)
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          # --offline: naming the remote (GITHUB_REPO below) would otherwise make
          # git-cliff fetch commit metadata from the GitHub API, which the template
          # never uses.
          args: >-
            --tag ${{ env.TAG }}
            --tag-pattern '${{ env.CLIFF_TAG_PATTERN }}'
            --strip header
            --offline
            --include-path 'apps/extension/**'
            ${{ env.CLIFF_RANGE }}
        env:
          OUTPUT: /tmp/release-notes.md
          # The template links each commit through remote.github, which git-cliff
          # reads from the checked-out branch's upstream; a detached checkout has
          # none, so every link came out empty until the remote was named here.
          GITHUB_REPO: ${{ github.repository }}

      - name: Show generated notes
        run: |
          echo '--- release notes preview ---'
          cat /tmp/release-notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: /tmp/release-notes.md
          if-no-files-found: error
          retention-days: 14

  attach-assets:
    needs: [resolve, lint-and-typecheck, unit-tests, network-e2e, build-chrome, build-firefox, smoke-against-artifact, smoke-firefox-against-artifact, release-notes]
    # Every gate must be exactly 'success', and the opt-in network suite exactly what the dispatch
    # asked for: rejecting only failure and cancelled would publish past a gate that never ran.
    # `!cancelled()` keeps a cancelled run from attaching assets.
    if: |
      always() && !cancelled() &&
      needs.release-notes.result == 'success' &&
      needs.resolve.result == 'success' &&
      needs.lint-and-typecheck.result == 'success' &&
      needs.unit-tests.result == 'success' &&
      needs.network-e2e.result == (github.event.inputs.run_network_e2e == 'true' && 'success' || 'skipped') &&
      needs.build-chrome.result == 'success' &&
      needs.build-firefox.result == 'success' &&
      needs.smoke-against-artifact.result == 'success' &&
      needs.smoke-firefox-against-artifact.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # id-token and attestations: the attest step signs through Sigstore and stores the attestation.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      # The workflow's own revision, never the tag's: the composite action and the scripts below run
      # with this job's write token, and an older tag's copies predate the `install` input.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          cache: "false"
          install: "false"

      - name: Download Chrome build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-chrome
          path: dist/release/chrome
      - name: Download Firefox build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-firefox
          path: dist/release/firefox
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: dist/notes

      # Every entry is stamped with the built commit's own time and written in a fixed order, so a
      # rebuild of the same commit with the same zip gives the same bytes (the runner image is not
      # pinned: a zip update could still move them).
      - name: Zip artifacts + SHASUMS
        run: |
          mkdir -p dist/release
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$SHA")
          export SOURCE_DATE_EPOCH
          bun scripts/release/zip-reproducible.ts dist/release/chrome "dist/release/nulo-chrome-${VERSION}.zip"
          bun scripts/release/zip-reproducible.ts dist/release/firefox "dist/release/nulo-firefox-${VERSION}.zip"
          cd dist/release
          sha256sum \
            "nulo-chrome-${VERSION}.zip" \
            "nulo-firefox-${VERSION}.zip" \
            > SHASUMS256.txt

      # publish: a release this run creates (or a draft a failed run left) is filled, checked and
      # published. use-published: a published release is never uploaded to; its own bytes ship.
      - name: Plan the release
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/release/attach-assets-run.ts plan

      # Before the publish: a failed attestation must never leave a published, unattested release.
      - name: Attest the release assets
        if: steps.plan.outputs.action == 'publish' && env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/nulo-chrome-${{ env.VERSION }}.zip
            dist/release/nulo-firefox-${{ env.VERSION }}.zip
            dist/release/SHASUMS256.txt

      - name: Publish the release
        if: steps.plan.outputs.action == 'publish' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: dist/notes/release-notes.md
        run: bun scripts/release/attach-assets-run.ts apply --expect publish

      - name: Verify the published release
        id: published
        if: steps.plan.outputs.action == 'use-published' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: dist/notes/release-notes.md
        run: bun scripts/release/attach-assets-run.ts verify-published

      # The store jobs ship this artifact: the published release's bytes when it already existed,
      # else the bytes this run just published (or, on a dry run, built).
      - name: Upload the release assets for the store jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ env.VERSION }}
          path: |
            ${{ steps.published.outputs.dir || 'dist/release' }}/nulo-chrome-${{ env.VERSION }}.zip
            ${{ steps.published.outputs.dir || 'dist/release' }}/nulo-firefox-${{ env.VERSION }}.zip
            ${{ steps.published.outputs.dir || 'dist/release' }}/SHASUMS256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Dry-run preview (skip publish)
        if: env.DRY_RUN == 'true'
        run: |
          echo "DRY RUN — the plan was ${ACTION}; nothing was tagged, uploaded or published for $TAG:"
          ls -la dist/release/
          echo ""
          echo "DRY RUN — the release body would be:"
          cat dist/notes/release-notes.md
        env:
          ACTION: ${{ steps.plan.outputs.action }}

  sync-main-to-dev:
    name: sync main → dev (post-release)
    needs: [resolve, attach-assets]
    # ADVISORY (deliberately NOT in the `status` aggregator): this runs AFTER the
    # release is published, so a sync hiccup must never retro-fail a shipped
    # release — a CONFLICTING/UNKNOWN sync is surfaced as a labeled PR, an IO
    # error reds this job alone. Push-only: a workflow_dispatch republish of an
    # old tag must never re-sync; the runner's syncEligible
    # re-checks `github.sha == the Release-PR merge commit` as defense in depth.
    # All logic lives in the unit-tested scripts/release/open-sync-pr*.ts.
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.resolve.outputs.is_prerelease == 'false' &&
      needs.attach-assets.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Every write goes through the App token below; the job token only checks out.
    permissions:
      contents: read
    steps:
      # App token so the sync PR is bot-opened → dev's required CI fires
      # (a GITHUB_TOKEN-opened PR suppresses the pull_request workflow), and the
      # branch + the manifest-rebaseline commit are App-authenticated. The sync PR is
      # MERGE-committed (not squashed) so main's release commit stays in dev's ancestry
      # — the prerelease version-anchor needs it (a squash drops it and re-breaks the rc
      # cut; see implementations-plan/release-prerelease-fix/). A merge (unlike a squash)
      # brings the branch's own manifest-rebaseline commit onto dev; open-sync-pr-run.ts
      # writes that commit via the Contents API under THIS App token, which GitHub SIGNS
      # (verified), so classic required_signatures is satisfied and the merge needs NO
      # `--admin`. (The `--admin` fallback only matters if that signing ever regresses.)
      # The token serves the API calls only; the checkout keeps no credential.
      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          cache: "false"
          install: "false"
      - name: Open the main→dev sync PR
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_PRERELEASE: ${{ needs.resolve.outputs.is_prerelease }}
          HEAD_SHA: ${{ github.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bun scripts/release/open-sync-pr-run.ts

  # Keyless: the job's OIDC token is exchanged through Google Workload Identity Federation for a
  # ten-minute access token on the service account linked to the store publisher. The environment
  # holds ids as VARIABLES and no secret; its protection rules (main only, required reviewer) and
  # the pool's attribute condition (repository id, environment, ref, event, workflow_ref) are what
  # bound this job. store-check.yml exercises the same credential read-only.
  publish-chrome-store:
    name: publish to Chrome Web Store (${{ needs.resolve.outputs.tag }})
    needs: [resolve, attach-assets]
    if: |
      always() && !cancelled() &&
      github.event.inputs.publish_chrome == 'true' &&
      needs.resolve.result == 'success' &&
      needs.attach-assets.result == 'success' &&
      needs.resolve.outputs.is_prerelease == 'false' &&
      needs.resolve.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      # No workspace install: the script imports only node: modules and Bun built-ins.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.resolve.outputs.version }}
          path: dist/release
      # Exactly one SHASUMS line may name this zip; `--ignore-missing` would pass on the other store's line alone.
      - name: Verify the Chrome zip checksum
        working-directory: dist/release
        run: |
          line=$(grep -E " nulo-chrome-${VERSION}\.zip$" SHASUMS256.txt)
          [ "$(printf '%s\n' "$line" | wc -l)" = "1" ] || { echo "::error::expected one SHASUMS line for nulo-chrome-${VERSION}.zip"; exit 1; }
          printf '%s\n' "$line" | sha256sum -c -
      - name: Authenticate to Google (OIDC → WIF)
        if: env.DRY_RUN != 'true'
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload and publish
        env:
          MODE: publish
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          CWS_PUBLISH_TYPE: ${{ vars.CWS_PUBLISH_TYPE }}
          ZIP_PATH: dist/release/nulo-chrome-${{ needs.resolve.outputs.version }}.zip
        run: bun scripts/release/publish-chrome-store-run.ts

  # Firefox Add-ons: same gate, one stored key pair. The `firefox-add-ons` environment holds
  # AMO_JWT_ISSUER + AMO_JWT_SECRET; they reach exactly one step, after every third-party action
  # has run. The source package Mozilla's reviewers rebuild is `git archive` of the release commit,
  # so it can never contain a credential. store-check.yml exercises the same key pair read-only.
  publish-firefox-amo:
    name: publish to Firefox Add-ons (${{ needs.resolve.outputs.tag }})
    needs: [resolve, attach-assets]
    if: |
      always() && !cancelled() &&
      github.event.inputs.publish_firefox == 'true' &&
      needs.resolve.result == 'success' &&
      needs.attach-assets.result == 'success' &&
      needs.resolve.outputs.is_prerelease == 'false' &&
      needs.resolve.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: firefox-add-ons
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      # No workspace install: the script imports only node: modules and Bun built-ins.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.resolve.outputs.version }}
          path: dist/release
      # Exactly one SHASUMS line may name this zip; `--ignore-missing` would pass on the other store's line alone.
      - name: Verify the Firefox zip checksum
        working-directory: dist/release
        run: |
          line=$(grep -E " nulo-firefox-${VERSION}\.zip$" SHASUMS256.txt)
          [ "$(printf '%s\n' "$line" | wc -l)" = "1" ] || { echo "::error::expected one SHASUMS line for nulo-firefox-${VERSION}.zip"; exit 1; }
          printf '%s\n' "$line" | sha256sum -c -
      # The reviewer's source package: the release commit, prefixed like a tarball, nothing untracked.
      - name: Package the source archive
        run: |
          mkdir -p dist/source
          git archive --format=zip --prefix="nulo-${VERSION}/" -o "dist/source/nulo-${VERSION}-source.zip" HEAD
          ls -l "dist/source/nulo-${VERSION}-source.zip"
      - name: Upload, create the version and attach the source
        env:
          MODE: publish
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          ZIP_PATH: dist/release/nulo-firefox-${{ needs.resolve.outputs.version }}.zip
          SOURCE_PATH: dist/source/nulo-${{ needs.resolve.outputs.version }}-source.zip
          LISTING_PATH: apps/extension/store/listing.md
        run: bun scripts/release/publish-firefox-amo-run.ts

  status:
    name: status
    if: always()
    needs:
      [
        release-please,
        auto-unstick,
        resolve,
        lint-and-typecheck,
        unit-tests,
        network-e2e,
        build-chrome,
        build-firefox,
        smoke-against-artifact,
        smoke-firefox-against-artifact,
        release-notes,
        attach-assets,
        publish-chrome-store,
        publish-firefox-amo,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate results
        env:
          EVENT: ${{ github.event_name }}
          RUN_NETWORK_E2E: ${{ github.event.inputs.run_network_e2e }}
          PUBLISH_CHROME: ${{ github.event.inputs.publish_chrome }}
          PUBLISH_FIREFOX: ${{ github.event.inputs.publish_firefox }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          UNSTUCK: ${{ needs.auto-unstick.outputs.unstuck }}
          IS_PRERELEASE: ${{ needs.resolve.outputs.is_prerelease }}
          ON_MAIN: ${{ needs.resolve.outputs.on_main }}
          RELEASE_PLEASE_RESULT: ${{ needs.release-please.result }}
          AUTO_UNSTICK_RESULT: ${{ needs.auto-unstick.result }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          LINT_AND_TYPECHECK_RESULT: ${{ needs.lint-and-typecheck.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          NETWORK_E2E_RESULT: ${{ needs.network-e2e.result }}
          BUILD_CHROME_RESULT: ${{ needs.build-chrome.result }}
          BUILD_FIREFOX_RESULT: ${{ needs.build-firefox.result }}
          SMOKE_RESULT: ${{ needs.smoke-against-artifact.result }}
          SMOKE_FIREFOX_RESULT: ${{ needs.smoke-firefox-against-artifact.result }}
          RELEASE_NOTES_RESULT: ${{ needs.release-notes.result }}
          ATTACH_ASSETS_RESULT: ${{ needs.attach-assets.result }}
          PUBLISH_CHROME_STORE_RESULT: ${{ needs.publish-chrome-store.result }}
          PUBLISH_FIREFOX_AMO_RESULT: ${{ needs.publish-firefox-amo.result }}
        run: |
          # An exact state machine, not a denylist: each stage must end as its own `if:` says,
          # `success` where it held and `skipped` where it did not, so a stage that never ran
          # (skipped for the wrong reason, cancelled before a runner, an empty result) fails here.
          # A cancel shows the same way: a cancelled stage reads `cancelled`, and one that
          # `!cancelled()` skipped reads `skipped` where `success` was due.
          expect() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1 is '$2', expected '$3'"
              exit 1
            fi
          }
          bool() {
            case "$2" in
              true | false) ;;
              *) echo "::error::$1 is not true/false: '$2'"; exit 1 ;;
            esac
          }
          ran() { if [ "$1" = true ]; then echo success; else echo skipped; fi }
          push=false
          if [ "$EVENT" = push ]; then push=true; fi
          expect release-please "$RELEASE_PLEASE_RESULT" "$(ran "$push")"
          unstick=false
          if [ "$push" = true ]; then
            # release-please leaves release_created empty unless it tagged a release itself.
            case "$RELEASE_CREATED" in
              "" | true | false) ;;
              *) echo "::error::release_created is not empty, true or false: '$RELEASE_CREATED'"; exit 1 ;;
            esac
            if [ "$RELEASE_CREATED" != true ]; then unstick=true; fi
          fi
          expect auto-unstick "$AUTO_UNSTICK_RESULT" "$(ran "$unstick")"
          if [ "$unstick" = true ]; then bool unstuck "$UNSTUCK"; fi
          chain=false
          if [ "$EVENT" = workflow_dispatch ] || [ "$RELEASE_CREATED" = true ] || [ "$UNSTUCK" = true ]; then
            chain=true
          fi
          expect resolve "$RESOLVE_RESULT" "$(ran "$chain")"
          network=false
          chrome_store=false
          firefox_amo=false
          if [ "$chain" = true ]; then
            bool is_prerelease "$IS_PRERELEASE"
            bool on_main "$ON_MAIN"
            if [ "$RUN_NETWORK_E2E" = true ]; then network=true; fi
            # The store jobs take only a stable tag whose commit is on main.
            if [ "$IS_PRERELEASE" = false ] && [ "$ON_MAIN" = true ]; then
              if [ "$PUBLISH_CHROME" = true ]; then chrome_store=true; fi
              if [ "$PUBLISH_FIREFOX" = true ]; then firefox_amo=true; fi
            fi
          fi
          expect lint-and-typecheck "$LINT_AND_TYPECHECK_RESULT" "$(ran "$chain")"
          expect unit-tests "$UNIT_TESTS_RESULT" "$(ran "$chain")"
          expect network-e2e "$NETWORK_E2E_RESULT" "$(ran "$network")"
          expect build-chrome "$BUILD_CHROME_RESULT" "$(ran "$chain")"
          expect build-firefox "$BUILD_FIREFOX_RESULT" "$(ran "$chain")"
          expect smoke-against-artifact "$SMOKE_RESULT" "$(ran "$chain")"
          expect smoke-firefox-against-artifact "$SMOKE_FIREFOX_RESULT" "$(ran "$chain")"
          expect release-notes "$RELEASE_NOTES_RESULT" "$(ran "$chain")"
          expect attach-assets "$ATTACH_ASSETS_RESULT" "$(ran "$chain")"
          expect publish-chrome-store "$PUBLISH_CHROME_STORE_RESULT" "$(ran "$chrome_store")"
          expect publish-firefox-amo "$PUBLISH_FIREFOX_AMO_RESULT" "$(ran "$firefox_amo")"
          echo "Release pipeline completed: every stage ended as its condition asks."
