name: Extension network e2e

on:
  workflow_dispatch:
    inputs:
      disable_presto:
        description: "Skip presto-server for this manual run (investigation override)"
        required: false
        type: boolean
        default: false
  pull_request:
    # NO `branches:` filter — see pr-quick.yml: that key filters on the PR's BASE,
    # so a stacked PR targeting its parent feature branch got no CI whatsoever.
    # `labeled` so adding `e2e:extension-network` (`e2e:network` is honored as an alias) after open triggers a fresh run;
    # `unlabeled` so removing it re-evaluates the gate instead of leaving
    # a stale failing result; `ready_for_review` gives a draft marked ready a fresh
    # run on its head (no gate reads the draft flag, so the head normally has a run
    # already; this one can replace a run that failed, was cancelled or never started).
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

concurrency:
  # One queue per head commit, so a late run of an older push can neither cancel nor replace the
  # current head's run; pr-supersede.yml cancels the runs of heads the pull request moved past.
  group: pr-extension-network-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.gate.outputs.run }}
      read-attempt: ${{ steps.live.outputs.read-attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: paths-filter needs the merge-base with the comparison
          # branch. On a shallow clone it falls back to a `fetch --deepen` loop,
          # which hits git's "shallow file has changed since we read it" race
          # whenever the merge-base sits beyond the initial depth (structural on
          # long-running branches ~100+ commits from the base).
          fetch-depth: 0
      - name: Read the live labels and head
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-cd/live-labels.sh e2e:extension-network e2e:network
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          filters: |
            extension-network:
              # Derived from the extension dependency graph (see CI.md "CI gating").
              # Whole-package for built targets (extension + the playground dApp the
              # harness drives); src + manifest for dependency libraries. NO `!`
              # negations. Pinned by scripts/ci-cd/behavior-gating.test.ts.
              # Built targets — extension + playground harness (whole packages):
              - 'apps/extension/**'
              - 'apps/playground/**'
              # Dependency libraries — consumed source + manifest:
              - 'packages/aztec-runtime/src/**'
              - 'packages/aztec-runtime/package.json'
              - 'packages/design/src/**'
              - 'packages/design/package.json'
              - 'packages/extension-messaging/src/**'
              - 'packages/extension-messaging/package.json'
              - 'packages/legal/src/**'
              - 'packages/legal/package.json'
              - 'packages/resolve-asset/src/**'
              - 'packages/resolve-asset/package.json'
              - 'packages/third-party-notices/src/**'
              - 'packages/third-party-notices/package.json'
              - 'packages/token-list/src/**'
              - 'packages/token-list/package.json'
              - 'packages/wallet-bridge/src/**'
              - 'packages/wallet-bridge/package.json'
              - 'packages/wallet-core/src/**'
              - 'packages/wallet-core/package.json'
              - 'packages/wallet-crypto/src/**'
              - 'packages/wallet-crypto/package.json'
              - 'packages/wallet-sdk-schema-patch/src/**'
              - 'packages/wallet-sdk-schema-patch/package.json'
              # Repo-wide build inputs:
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'patches/**'
              # Network workflow + composite actions:
              - '.github/workflows/_extension-network-e2e.yml'
              - '.github/workflows/_extension-network-e2e-lane.yml'
              - '.github/workflows/pr-extension-network-e2e.yml'
              - 'scripts/ci-cd/e2e-decide.sh'
              - 'scripts/ci-cd/e2e-aggregate.sh'
              - '.github/actions/setup-aztec/**'
              - '.github/actions/setup-presto-server/**'
              - '.github/actions/setup-bun/**'
              - '.github/actions/setup-puppeteer/**'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "full=true" >> "$GITHUB_OUTPUT"

      - name: Decide
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.live.outputs.base }}
          LABEL_HIT: ${{ steps.live.outputs.label-hit }}
          SURFACE: ${{ steps.override.outputs.full || steps.filter.outputs.extension-network }}
        run: bash scripts/ci-cd/e2e-decide.sh

  network-e2e:
    name: Run
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/_extension-network-e2e-lane.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      # retry: 0 — the PR gate is the honest acceptance signal. A test-dimension
      # retry would re-mask app flakes; pure infra-boot flakes are handled by the
      # agent's exit-86 sentinel (one infra-retry in _extension-network-e2e.yml).
      retry: "0"
      # The canary job's real proving: Presto ON unless the emergency kill switch is set.
      disable_presto: ${{ github.event.inputs.disable_presto == 'true' || vars.NULO_E2E_DISABLE_PRESTO == '1' }}

  status:
    name: extension-network-e2e-status
    if: always()
    needs: [changes, network-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The commit this run's workflow file came from, so the script is the one this file was written
      # against. A failed fetch reds the check: it is never green without the evaluation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: /scripts/ci-cd/e2e-aggregate.sh
          sparse-checkout-cone-mode: false
      - name: Aggregate results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash scripts/ci-cd/e2e-aggregate.sh
