name: Extension network e2e

on:
  workflow_dispatch:
    inputs:
      disable_presto:
        description: "Skip presto-server for this manual run (investigation override)"
        required: false
        type: boolean
        default: false
  pull_request:
    # NO `branches:` filter — see pr-quick.yml: that key filters on the PR's BASE,
    # so a stacked PR targeting its parent feature branch got no CI whatsoever.
    # `labeled` so adding `e2e:extension-network` (`e2e:network` is honored as an alias) after open triggers a fresh run;
    # `unlabeled` so removing it re-evaluates the gate instead of leaving
    # a stale failing result; `ready_for_review` gives a draft marked ready a fresh
    # run on its head (no gate reads the draft flag, so the head normally has a run
    # already; this one can replace a run that failed, was cancelled or never started).
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

concurrency:
  # One queue per head commit, so a late run of an older push can neither cancel nor replace the
  # current head's run; pr-supersede.yml cancels the runs of heads the pull request moved past.
  group: pr-extension-network-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.gate.outputs.run }}
      read-attempt: ${{ steps.live.outputs.read-attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: paths-filter needs the merge-base with the comparison
          # branch. On a shallow clone it falls back to a `fetch --deepen` loop,
          # which hits git's "shallow file has changed since we read it" race
          # whenever the merge-base sits beyond the initial depth (structural on
          # long-running branches ~100+ commits from the base).
          fetch-depth: 0
      - name: Read the live labels and head
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-cd/live-labels.sh e2e:extension-network e2e:network
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          filters: |
            extension-network:
              # Derived from the extension dependency graph (see CI.md "CI gating").
              # Whole-package for built targets (extension + the playground dApp the
              # harness drives); src + manifest for dependency libraries. NO `!`
              # negations. Pinned by scripts/ci-cd/behavior-gating.test.ts.
              # Built targets — extension + playground harness (whole packages):
              - 'apps/extension/**'
              - 'apps/playground/**'
              # Dependency libraries — consumed source + manifest:
              - 'packages/aztec-runtime/src/**'
              - 'packages/aztec-runtime/package.json'
              - 'packages/design/src/**'
              - 'packages/design/package.json'
              - 'packages/extension-messaging/src/**'
              - 'packages/extension-messaging/package.json'
              - 'packages/legal/src/**'
              - 'packages/legal/package.json'
              - 'packages/resolve-asset/src/**'
              - 'packages/resolve-asset/package.json'
              - 'packages/third-party-notices/src/**'
              - 'packages/third-party-notices/package.json'
              - 'packages/token-list/src/**'
              - 'packages/token-list/package.json'
              - 'packages/wallet-bridge/src/**'
              - 'packages/wallet-bridge/package.json'
              - 'packages/wallet-core/src/**'
              - 'packages/wallet-core/package.json'
              - 'packages/wallet-crypto/src/**'
              - 'packages/wallet-crypto/package.json'
              - 'packages/wallet-sdk-schema-patch/src/**'
              - 'packages/wallet-sdk-schema-patch/package.json'
              # Repo-wide build inputs:
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'patches/**'
              # Network workflow + composite actions:
              - '.github/workflows/_extension-network-e2e.yml'
              - '.github/workflows/pr-extension-network-e2e.yml'
              - 'scripts/ci-cd/e2e-decide.sh'
              - 'scripts/ci-cd/e2e-aggregate.sh'
              - '.github/actions/setup-aztec/**'
              - '.github/actions/setup-presto-server/**'
              - '.github/actions/setup-bun/**'
              - '.github/actions/setup-puppeteer/**'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "full=true" >> "$GITHUB_OUTPUT"

      - name: Decide
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.live.outputs.base }}
          LABEL_HIT: ${{ steps.live.outputs.label-hit }}
          SURFACE: ${{ steps.override.outputs.full || steps.filter.outputs.extension-network }}
        run: bash scripts/ci-cd/e2e-decide.sh

  network-e2e:
    name: Run / shard ${{ matrix.shard.id }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      # Don't cancel other shards when one fails — under flaky CI we want the
      # full per-shard picture. fail-fast: true would mask "is this 1 specific
      # shard failing or is the suite broadly broken?"
      fail-fast: false
      matrix:
        # N=5 splits the lightweight network test files into ~21-per-shard.
        # N=5 (not N=4) because vitest's deterministic SHA-1-of-file-path
        # sharder puts the two known slow files (multi-account-from,
        # tx-sendTx-multicall) into the same shard at N=4; N=5 separates
        # them. ~25% more runner cost for materially better worst-case
        # shard wall-time.
        #
        # Heavy-network tests run in the `network-e2e-heavy` job below — they
        # are EXCLUDED here so they don't pre-pressure the prover queue for
        # popup-shape tests on the same shard host.
        #
        # `id` is the vitest --shard=N/M value. `label` is the artifact-safe
        # variant (no `/`). actions/upload-artifact rejects `/` in artifact
        # names (https://github.com/actions/upload-artifact/issues/647), so
        # the reusable workflow takes both as separate inputs.
        shard:
          - { id: "1/5", label: "1-of-5" }
          - { id: "2/5", label: "2-of-5" }
          - { id: "3/5", label: "3-of-5" }
          - { id: "4/5", label: "4-of-5" }
          - { id: "5/5", label: "5-of-5" }
    uses: ./.github/workflows/_extension-network-e2e.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      shard: ${{ matrix.shard.id }}
      shard_label: ${{ matrix.shard.label }}
      # retry: 0 — the PR gate is the honest acceptance signal. A test-dimension
      # retry would re-mask app flakes; pure infra-boot flakes are handled by the
      # agent's exit-86 sentinel (one infra-retry in _extension-network-e2e.yml).
      retry: "0"
      # Proverless shard pool (fast, Presto OFF). Exclude every file a dedicated
      # job below runs: the three heavy jobs' files (proverless too), the five
      # prover-ON files, which run with REAL proving in network-e2e-canary, and
      # the chaos file. The partition is pinned by scripts/ci-cd/behavior-gating.test.ts.
      exclude_files: "tests/e2e/network/fee-methods.test.ts tests/e2e/network/selfpay-phase.test.ts tests/e2e/network/concurrent-sendtx-confirm.test.ts tests/e2e/network/transfers.test.ts tests/e2e/network/tx-sendTx-default.test.ts tests/e2e/network/frozen-account-canary.test.ts tests/e2e/network/passkey-execution-canary.test.ts tests/e2e/network/delete-after-prove.test.ts tests/e2e/network/same-token-concurrent-sends.test.ts tests/e2e/network/send-chaos.test.ts tests/e2e/network/snack-placement.test.ts tests/e2e/network/failed-send-check.test.ts"
      proverless: true

  network-e2e-heavy:
    name: Run / heavy / fee-methods + selfpay-phase
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # Dedicated runner so the prover queue isn't shared with popup-shape
    # tests. fee-methods is ~6 min wall-time (5 tests, 4 real fee-juice TX
    # flows requiring full WASM proving on CI). Without this isolation the
    # fee-methods queue pressure caused the next file on the same shard to
    # exceed waitForPgResult budgets.
    # selfpay-phase (the wallet's setup-phase/account-identity gate: ~10
    # dApp sends + a dozen simulates across two accounts and three fee
    # routes) shares this runner for the same reason and to keep the L1
    # dev-key bridges serialized on one host.
    uses: ./.github/workflows/_extension-network-e2e.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      shard_label: "heavy"
      retry: "0"
      test_files: "tests/e2e/network/fee-methods.test.ts tests/e2e/network/selfpay-phase.test.ts"
      # fee-methods is PLAIN proverless (no barrier; the fee flows don't depend
      # on prove duration). Proverless implies Presto OFF.
      proverless: true

  network-e2e-heavy-concurrent:
    name: Run / heavy / concurrent-confirm
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # Dedicated runner, same rationale as fee-methods: two sequential dApp
    # sendTx proves (both approved → both confirm, serialized by the execution
    # mutex). Kept off the SHA-1 matrix so its WASM-prove CPU doesn't pressure
    # popup-shape tests sharing a shard host, and separate from fee-methods so
    # the two heavy workloads don't share one prover queue.
    # same-token-concurrent-sends holds the node's block production, which every file of a
    # shard shares, so it runs here and never in the pool.
    uses: ./.github/workflows/_extension-network-e2e.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      shard_label: "heavy-concurrent"
      retry: "0"
      test_files: "tests/e2e/network/concurrent-sendtx-confirm.test.ts tests/e2e/network/same-token-concurrent-sends.test.ts"
      # STUB + barrier: proverless makes prove sub-second, so the test holds T1
      # at `proving` via the ProofGate to keep the ordering assert deterministic.
      proverless: true

  network-e2e-heavy-long:
    name: Run / heavy / snack-placement + failed-send-check
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # Two files of about 8 and 4.5 minutes on Firefox. The SHA-1 sharder weighs no runtime, and the
    # shard that drew both reached its 30-minute job limit with every test green.
    uses: ./.github/workflows/_extension-network-e2e.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      shard_label: "heavy-long"
      retry: "0"
      test_files: "tests/e2e/network/snack-placement.test.ts tests/e2e/network/failed-send-check.test.ts"
      proverless: true

  network-e2e-canary:
    name: Run / canary / real-proving
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # The ONLY prover-ON jobs after the proverless split — they guard the real
    # BB-proving path the proverless pool no longer exercises:
    #   - transfers: wallet-UI flow, waits through real prove → mine (balance change).
    #   - tx-sendTx-default: dApp flow, waits through real prove → submit (the node
    #     validates a REAL proof at node.sendTx; playground hard-codes NO_WAIT so
    #     mine isn't awaited). Covers dapp-send-executor plumbing transfers doesn't.
    #   - frozen-account-canary: the address-freeze execution gate (frozen-ctor
    #     multicall deploy → init-nullifier flip → authwit consume →
    #     background-restart re-derive), which MUST see real proving — a fake
    #     proof would green a frozen artifact the prover can no longer prove
    #     (CLAUDE.md "Account-address freeze").
    #   - passkey-execution-canary: the passkey analog (PRF ceremony → frozen
    #     ctor → authwit consume → background-restart ceremony re-unlock), the
    #     KDF-change execution gate; real proving for the same reason.
    #   - delete-after-prove: deleting the profile that just proved and sent a
    #     transaction, while bb.js holds its CRS store open in IndexedDB.
    # The same five files run on Firefox (pr-extension-network-e2e-firefox.yml);
    # a red canary on either browser holds an @aztec bump.
    # Dedicated runner with presto-server (proverless: false default).
    uses: ./.github/workflows/_extension-network-e2e.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      shard_label: "canary"
      retry: "0"
      test_files: "tests/e2e/network/transfers.test.ts tests/e2e/network/tx-sendTx-default.test.ts tests/e2e/network/frozen-account-canary.test.ts tests/e2e/network/passkey-execution-canary.test.ts tests/e2e/network/delete-after-prove.test.ts"
      # Real proving — Presto ON unless the emergency kill switch is set.
      disable_presto: ${{ github.event.inputs.disable_presto == 'true' || vars.NULO_E2E_DISABLE_PRESTO == '1' }}

  network-e2e-chaos:
    name: Run / chaos / seed ${{ matrix.seed }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # Fixed send-chaos seeds, each beside the nightly run it comes from; the red-seed and rotation
    # rules are in CI.md, § pr-extension-network-e2e.yml.
    strategy:
      fail-fast: false
      matrix:
        seed:
          - "1095865833" # nightly run 37607270016 (2026-10-07), its Firefox chaos job
          - "1960252198" # nightly run 37765624647 (2026-10-08), its Chrome chaos job
    uses: ./.github/workflows/_extension-network-e2e.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      shard_label: chaos-${{ matrix.seed }}
      retry: "0"
      test_files: "tests/e2e/network/send-chaos.test.ts"
      proverless: true
      chaos: true
      chaos_seed: ${{ matrix.seed }}

  status:
    name: extension-network-e2e-status
    if: always()
    needs: [changes, network-e2e, network-e2e-heavy, network-e2e-heavy-concurrent, network-e2e-heavy-long, network-e2e-canary, network-e2e-chaos]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The commit this run's workflow file came from, so the script is the one this file was written
      # against. A failed fetch reds the check: it is never green without the evaluation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: /scripts/ci-cd/e2e-aggregate.sh
          sparse-checkout-cone-mode: false
      - name: Aggregate results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash scripts/ci-cd/e2e-aggregate.sh
