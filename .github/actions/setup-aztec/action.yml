name: Setup Aztec
description: |
  Install the Aztec CLI matching the @aztec-labs/aztec.js version declared in apps/extension,
  cached by version and by the content of this directory. `install.sh` does the install; the
  local Docker runner (apps/extension/scripts/e2e/docker-ci-like.sh) runs the same script.

  Every download is SHA-256-pinned in `installer-pins.sha256` and the npm tree is locked in
  `cli/package-lock.json`; SECURITY.md § Binary dependencies has the trust posture.

inputs:
  skip_cli:
    description: Skip Foundry + Aztec CLI install (use when the test points at a remote node).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Detect Aztec version
      if: inputs.skip_cli != 'true'
      id: detect
      shell: bash
      run: |
        VERSION=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('apps/extension/package.json','utf8')).dependencies['@aztec-labs/aztec.js'])")
        echo "Aztec version: $VERSION (from apps/extension)"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Install Node.js 24
      if: inputs.skip_cli != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    # No foundry-rs/foundry-toolchain here: @aztec-labs/ethereum's resolveFoundryBinary prefers the
    # pin's internal-bin (priority 2, which install.sh fills from the pinned Foundry tarball) over
    # ~/.foundry/bin (priority 4), and an unpinned system forge taking over would break the L1
    # deploy (version-forked `forge script --batch` args). The preflight step below fails loudly
    # here, not mid-L1-deploy, if internal-bin regresses.

    # Any change under this directory (a pin, the lockfile, install.sh) changes the key, so the
    # changed install certifies itself with one cold run instead of riding an older cache.
    - name: Cache Aztec CLI
      if: inputs.skip_cli != 'true'
      id: cache-aztec
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.aztec/versions/${{ steps.detect.outputs.version }}
        key: ${{ runner.os }}-aztec-${{ steps.detect.outputs.version }}-${{ hashFiles('.github/actions/setup-aztec/**') }}-v4

    - name: Install Aztec CLI
      if: inputs.skip_cli != 'true' && steps.cache-aztec.outputs.cache-hit != 'true'
      shell: bash
      env:
        AZTEC_VERSION: ${{ steps.detect.outputs.version }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"

    # On a cache hit nothing else checks the restored forge/anvil, which the L1 deploy resolves first.
    - name: Assert bundled Foundry toolchain
      if: inputs.skip_cli != 'true'
      shell: bash
      env:
        AZTEC_VERSION: ${{ steps.detect.outputs.version }}
      run: |
        BIN="$HOME/.aztec/versions/${AZTEC_VERSION}/internal-bin"
        for tool in forge anvil; do
          if [ ! -x "$BIN/$tool" ]; then
            echo "::error::aztec ${AZTEC_VERSION} install is missing executable internal-bin/$tool — the bundled Foundry toolchain regressed (or a partial cache was restored). Sandbox L1 deploys would fail."
            ls -la "$BIN" || true
            exit 1
          fi
          # Executable-bit alone can't catch a truncated/corrupt cached binary.
          if ! "$BIN/$tool" --version; then
            echo "::error::internal-bin/$tool exists but failed to run — corrupt binary or partial cache restore."
            exit 1
          fi
        done
        echo "Bundled toolchain OK: $BIN/{forge,anvil}"

    - name: Update PATH
      if: inputs.skip_cli != 'true'
      shell: bash
      env:
        AZTEC_VERSION: ${{ steps.detect.outputs.version }}
      run: |
        echo "$HOME/.aztec/versions/${AZTEC_VERSION}/bin" >> "$GITHUB_PATH"
        echo "$HOME/.aztec/versions/${AZTEC_VERSION}/node_modules/.bin" >> "$GITHUB_PATH"

    # global-setup.ts probes ~/.aztec/current/bin/aztec-anvil + ~/.aztec/current/node_modules/.bin/aztec.
    # (5.0 renamed bundled bare binaries to aztec-* on PATH — `anvil` is now `aztec-anvil`.)
    # The install above writes to ~/.aztec/versions/<version>/ but does NOT create
    # a `current` symlink (locally, `aztec-up` would). Without this, every CI
    # network-e2e run silently skips because global-setup falls through the
    # "binary not found" branch with aztecTestConfig undefined.
    - name: Symlink ~/.aztec/current
      if: inputs.skip_cli != 'true'
      shell: bash
      env:
        AZTEC_VERSION: ${{ steps.detect.outputs.version }}
      run: |
        ln -sfn "$HOME/.aztec/versions/${AZTEC_VERSION}" "$HOME/.aztec/current"
        ls -la "$HOME/.aztec/current/bin/aztec-anvil" "$HOME/.aztec/current/node_modules/.bin/aztec"
