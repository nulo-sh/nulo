name: Setup Bun
description: |
  Install Bun, restore the install cache, and run `bun install --frozen-lockfile` unless `install`
  is "false".
  Callers must check out the repository before invoking this action.

  Bun version is pinned (matches `packageManager` in root package.json).
  Cache key includes the Bun version so a Bun bump invalidates stale state.

inputs:
  cache:
    description: |
      "true" restores and saves the Bun install cache. A build that produces release bytes, and a
      job that holds a write token, pass "false" and install from the registry against bun.lock:
      Bun never re-checks cached files against the lockfile, and the install runs trusted
      packages' lifecycle scripts, so a poisoned cache would ship in the zips or run beside the
      token.
    required: false
    default: "true"
  install:
    description: |
      "false" installs Bun alone. A job that signs, tags or publishes needs only Bun built-ins, and a
      dependency install would run lifecycle scripts beside its credentials.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # An exact version resolves without the GitHub API, so the action gets no token; its
    # default is the job's, which in a publishing job can write releases.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
        token: ""

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.cache == 'true'
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-1.4.2-
          ${{ runner.os }}-bun-

    - if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
